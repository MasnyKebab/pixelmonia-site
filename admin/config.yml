backend:
  name: git-gateway
  branch: main # Zmień na 'master', jeśli twoje repo używa master

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # KOLEKCJA: NEWS
  - name: "news"
    label: "Newsy"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Tytuł", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Tag", name: "tag", widget: "select", options: ["Sezon 6", "Turniej", "Społeczność", "Aktualizacja"] }
      - { label: "Treść", name: "body", widget: "markdown" }

  # KOLEKCJA: EVENTY (dla kalendarza)
  - name: "events"
    label: "Eventy"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Nazwa eventu", name: "title", widget: "string" }
      - { label: "Data rozpoczęcia", name: "start", widget: "datetime" }
      - { label: "Data zakończenia (opcjonalnie)", name: "end", widget: "datetime", required: false }
      - { label: "Opis", name: "description", widget: "text", required: false }